<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Store image compositions. Open with ?shot=hero|formats|style|timing|drag|tile|marquee -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    color: #f2f2f3;
    background: radial-gradient(1200px 600px at 20% 0%, #24304a 0%, rgba(36, 48, 74, 0) 60%), #121317;
  }
  .shot { width: 1280px; height: 800px; position: relative; }
  .caption { position: absolute; left: 60px; top: 46px; right: 60px; }
  .caption h1 { margin: 0; font-size: 40px; font-weight: 750; letter-spacing: -0.02em; }
  .caption p { margin: 10px 0 0; font-size: 19px; color: #a9adbb; }

  /* generic browser window */
  .window {
    position: absolute; left: 60px; top: 170px; width: 1160px; height: 600px;
    border-radius: 14px; overflow: hidden; background: #1f2026;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px #2c2e36;
  }
  .toolbar { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #2a2b31; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #4a4c55; display: block; }
  .address { flex: 1; height: 30px; border-radius: 15px; background: #1b1c21; color: #8d909b; font-size: 14px; display: flex; align-items: center; padding: 0 14px; }
  .ext { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: #3a3c45; }
  .ext img { width: 20px; height: 20px; }
  .content { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; }
  .scene { position: absolute; inset: 0; }
  .scene svg { width: 100%; height: 100%; display: block; }

  /* subtitle, same look as the overlay */
  .sub {
    position: absolute; left: 0; width: 854px; text-align: center; line-height: 1.3;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-weight: 700; color: #fff;
  }
  .sub span { padding: 0 0.3em; border-radius: 0.15em; }
  .outline span {
    text-shadow: 2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 1.5px 1.5px 0 #000, -1.5px 1.5px 0 #000,
      1.5px -1.5px 0 #000, -1.5px -1.5px 0 #000, 0 3px 6px rgba(0, 0, 0, 0.8);
  }
  .dragged span { outline: 1.5px dashed rgba(255, 255, 255, 0.85); outline-offset: 3px; }
  .cursor { position: absolute; width: 30px; height: 30px; }

  .popup {
    position: absolute; top: 8px; right: 14px; width: 290px; border: 0; border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px #2f3036; background: #151515;
  }
  .chips { position: absolute; display: flex; gap: 12px; }
  .chip {
    font: 700 22px/1 ui-monospace, Menlo, monospace; padding: 14px 20px; border-radius: 12px;
    background: rgba(18, 19, 23, 0.82); border: 1px solid rgba(255, 255, 255, 0.18);
  }
  .keys { position: absolute; display: flex; gap: 10px; align-items: center; font-size: 18px; color: #e6e7ea; }
  .key {
    font: 600 20px/1 -apple-system, sans-serif; min-width: 44px; padding: 10px 12px; text-align: center;
    border-radius: 9px; background: #f2f2f3; color: #151515; box-shadow: 0 3px 0 #9a9ba3;
  }
  .pill-note {
    position: absolute; padding: 10px 16px; border-radius: 999px; font-size: 16px; font-weight: 600;
    background: rgba(18, 19, 23, 0.82); border: 1px solid rgba(255, 255, 255, 0.16);
  }

  /* promo tiles */
  .tile { position: relative; overflow: hidden; background: linear-gradient(135deg, #1b2a52 0%, #2e5ce0 100%); }
  .tile .brand { position: absolute; display: flex; align-items: center; }
  .tile img { display: block; }
  .tile h2 { margin: 0; font-weight: 800; letter-spacing: -0.02em; }
  .tile p { margin: 0; color: #dbe5ff; }
  .fmt { display: inline-block; font: 700 13px/1 ui-monospace, Menlo, monospace; padding: 6px 9px; border-radius: 7px; background: rgba(255, 255, 255, 0.16); margin-right: 6px; }
</style>
</head>
<body>
<template id="scene">
  <svg viewBox="0 0 1160 554" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a2350"/><stop offset="0.55" stop-color="#7a4b8f"/><stop offset="1" stop-color="#f3a77b"/>
      </linearGradient>
      <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e59a7c"/><stop offset="1" stop-color="#2b2550"/>
      </linearGradient>
      <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#fff2c9"/><stop offset="0.6" stop-color="#ffd08a"/><stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1160" height="554" fill="url(#sky)"/>
    <g fill="#fff" opacity="0.85">
      <circle cx="90" cy="60" r="1.6"/><circle cx="210" cy="110" r="1.2"/><circle cx="330" cy="40" r="1.8"/><circle cx="460" cy="90" r="1.1"/>
      <circle cx="610" cy="50" r="1.5"/><circle cx="740" cy="120" r="1.2"/><circle cx="880" cy="70" r="1.7"/><circle cx="1020" cy="40" r="1.3"/>
      <circle cx="1100" cy="130" r="1.1"/><circle cx="150" cy="170" r="1"/><circle cx="560" cy="150" r="1"/><circle cx="960" cy="180" r="1.2"/>
    </g>
    <circle cx="700" cy="300" r="120" fill="url(#sun)"/>
    <circle cx="700" cy="300" r="46" fill="#fff4d6"/>
    <path d="M0 300 L120 230 L230 285 L360 200 L480 280 L560 250 L660 300 L760 240 L880 290 L1000 220 L1160 290 L1160 340 L0 340 Z" fill="#4a3a6e"/>
    <path d="M0 330 L150 280 L260 320 L420 270 L560 330 L700 290 L840 335 L980 285 L1160 330 L1160 360 L0 360 Z" fill="#33295a"/>
    <rect y="350" width="1160" height="204" fill="url(#lake)"/>
    <ellipse cx="700" cy="372" rx="70" ry="6" fill="#fff4d6" opacity="0.7"/>
    <ellipse cx="700" cy="392" rx="46" ry="4" fill="#fff4d6" opacity="0.5"/>
    <ellipse cx="700" cy="410" rx="28" ry="3" fill="#fff4d6" opacity="0.35"/>
    <path d="M0 554 L0 420 Q60 400 120 430 L160 380 L175 430 Q240 410 300 450 L340 554 Z" fill="#161331"/>
    <path d="M1160 554 L1160 400 L1120 330 L1095 400 L1060 350 L1035 420 Q980 430 940 470 L900 554 Z" fill="#161331"/>
  </svg>
</template>

<script>
const shot = new URLSearchParams(location.search).get('shot') || 'hero';
const scene = () => document.getElementById('scene').innerHTML;
const preview = (params, height) =>
  `<iframe class="popup" style="height:${height}px" src="popup-preview.html?${new URLSearchParams(params)}"></iframe>`;
const browser = (inner) => `
  <div class="window">
    <div class="toolbar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="address">video.example/watch/episode-01</div>
      <div class="ext"><img src="../icons/icon32.png" alt=""></div>
    </div>
    <div class="content"><div class="scene">${scene()}</div>${inner}</div>
  </div>`;
const caption = (title, text) => `<div class="caption"><h1>${title}</h1><p>${text}</p></div>`;
const sub = (lines, { size = 30, bottom = 46, cls = 'outline', color = '#fff', bg = 0, left = 0 } = {}) =>
  `<div class="sub ${cls}" style="bottom:${bottom}px;font-size:${size}px;color:${color};left:${left}px">${
    lines.map((l) => `<div><span style="background:rgba(0,0,0,${bg})">${l}</span></div>`).join('')}</div>`;

const SHOTS = {
  hero: () => caption('Subtitles on any web video', 'Load your own .ass, .srt or .smi file and watch with subtitles synced to the video.')
    + browser(sub(['오늘 밤은 별이 정말 잘 보이네.']) + preview({ hover: 'Subtitles' }, 451)),

  formats: () => caption('Your subtitle files, any format', 'ASS / SSA, SRT and SMI. Korean EUC-KR and UTF-16 files open correctly.')
    + browser(sub(['저 호수 끝까지 같이 걸어갈래?'])
      + `<div class="chips" style="left:60px;top:40px"><div class="chip">.ASS</div><div class="chip">.SRT</div><div class="chip">.SMI</div></div>`
      + preview({ view: 'file', file: 'episode01.kor.smi', lines: 412, msg: 'Loaded 412 lines' }, 244)),

  style: () => caption('Make it easy to read', 'Size, color, outline, background box and font, changed live while you watch.')
    + browser(sub(['노을이 지기 전에 사진 한 장 찍자!'], { size: 40, color: '#fff35c', bg: 0.55, cls: 'outline' })
      + preview({ view: 'color', picker: 1, s: JSON.stringify({ color: '#fff35c' }) }, 541)),

  timing: () => caption('Fix timing in a click', 'Shift subtitles earlier or later by 0.1 s, or use the keyboard without leaving the video.')
    + browser(sub(['방금 그 말, 다시 한 번 해 줄래?'])
      + `<div class="keys" style="left:60px;top:40px"><span class="key">⌥</span><span class="key">[</span><span>earlier</span>
         <span style="width:18px"></span><span class="key">⌥</span><span class="key">]</span><span>later</span></div>`
      + preview({ view: 'timing', s: JSON.stringify({ offset: 0.3 }) }, 215)),

  drag: () => caption('Drag subtitles anywhere, even in fullscreen', 'Grab the text and move it out of the way. The position is remembered.')
    + browser(sub(['여기라면 화면을 가리지 않겠지?'], { bottom: 250, left: 120, cls: 'outline dragged' })
      + `<svg class="cursor" style="left:752px;top:292px" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>`
      + `<div class="pill-note" style="left:300px;top:470px">Position saved · works in fullscreen</div>`),

  tile: () => `<div class="tile" style="width:440px;height:280px">
      <div class="brand" style="left:32px;top:40px;gap:16px"><img src="../icons/icon128.png" width="72" height="72" alt="">
        <h2 style="font-size:32px">Subtitle<br>Overlay</h2></div>
      <p style="position:absolute;left:32px;top:160px;font-size:17px">Your subtitles on any web video</p>
      <div style="position:absolute;left:32px;top:204px"><span class="fmt">.ASS</span><span class="fmt">.SRT</span><span class="fmt">.SMI</span></div>
    </div>`,

  marquee: () => `<div class="tile" style="width:1400px;height:560px">
      <div class="brand" style="left:90px;top:150px;gap:30px"><img src="../icons/icon128.png" width="128" height="128" alt="">
        <h2 style="font-size:68px">Subtitle Overlay</h2></div>
      <p style="position:absolute;left:92px;top:320px;font-size:28px">Load .ass, .srt or .smi files and watch any web video with synced subtitles.</p>
      <div style="position:absolute;left:92px;top:388px"><span class="fmt" style="font-size:18px;padding:9px 13px">.ASS</span><span class="fmt" style="font-size:18px;padding:9px 13px">.SRT</span><span class="fmt" style="font-size:18px;padding:9px 13px">.SMI</span></div>
    </div>`
};

document.body.innerHTML = (shot === 'tile' || shot === 'marquee') ? SHOTS[shot]() : `<div class="shot">${SHOTS[shot]()}</div>`;
</script>
</body>
</html>
